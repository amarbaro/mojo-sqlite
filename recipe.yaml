# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.3

package:
  name: "mojo-sqlite"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/sqlite -o ${{ PREFIX }}/lib/mojo/sqlite.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-sqlite
  license: Apache-2.0
  license_file: LICENSE
  summary: SQLite bindings for Mojo, measured against Python sqlite3
  repository: https://github.com/amarbaro/mojo-sqlite

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-sqlite
